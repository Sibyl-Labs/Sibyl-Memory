# macOS framework-Python smoke (Sibyl-Labs/Sibyl-Memory#29 / PR #30). Installs
# the python.org "Framework" build, strips its CA store, proves the stdlib
# default context then cannot verify api.sibyllabs.org and https_context() can.
# Manual only: no macOS box on the lab side, so this is the publish gate.
name: macOS framework-Python smoke

on:
  workflow_dispatch:

env:
  # python.org universal2 installer. Refresh: newest 3.12.x pkg + shasum -a 256.
  PY_URL: https://www.python.org/ftp/python/3.12.10/python-3.12.10-macos11.pkg
  PY_SHA256: 8373e58da4ea146b3eb1c1f9834f19a319440b6b679b06050b1f9ee3237aa8e4
  PY_FRAMEWORK: /Library/Frameworks/Python.framework/Versions/3.12/bin/python3
  PROBE_URL: https://api.sibyllabs.org/api/plugin/health

jobs:
  wheels:
    name: build wheels
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip build
      - name: build
        run: |
          set -eux
          for pkg in sibyl-memory-client sibyl-memory-hermes sibyl-memory-mcp sibyl-memory-cli; do
            python -m build --wheel --outdir dist "$pkg"
          done
          ls -la dist
      - uses: actions/upload-artifact@v4
        with:
          name: wheels
          path: dist/*.whl
          if-no-files-found: error

  smoke:
    name: macOS framework Python
    needs: wheels
    runs-on: macos-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: wheels
          path: dist

      - name: install the python.org framework build (no Install Certificates.command)
        run: |
          set -eux
          curl -fsSL -o python.pkg "$PY_URL"
          echo "$PY_SHA256  python.pkg" | shasum -a 256 -c -
          sudo installer -pkg python.pkg -target /
          "$PY_FRAMEWORK" -VV

      - name: install the built wheels into a venv
        run: |
          set -eux
          "$PY_FRAMEWORK" -m venv "$RUNNER_TEMP/smoke"
          "$RUNNER_TEMP/smoke/bin/python" -m pip install --upgrade pip
          "$RUNNER_TEMP/smoke/bin/python" -m pip install --find-links dist dist/*.whl

      - name: strip the pre-wired CA store (reproduce the report)
        # The image already ran Install Certificates.command (etc/openssl holds a
        # certifi symlink), so the stock context verifies and the report is NOT
        # reproduced until it is removed. A fake pem would test a different bug.
        run: |
          set -eux
          unset SSL_CERT_FILE SSL_CERT_DIR || true
          env | grep -i '^SSL_' || true
          PREFIX="$(dirname "$(dirname "$PY_FRAMEWORK")")"
          ls -la "$PREFIX/etc/openssl" || true
          mkdir -p "$RUNNER_TEMP/ca-backup"
          sudo mv "$PREFIX/etc/openssl/cert.pem" "$RUNNER_TEMP/ca-backup/" || true
          sudo mv "$PREFIX/etc/openssl/certs" "$RUNNER_TEMP/ca-backup/" || true
          "$PY_FRAMEWORK" -c "import ssl; print(ssl.get_default_verify_paths()); print(ssl.OPENSSL_VERSION)"

      - name: write the shared TLS classifier
        run: |
          cat > "$RUNNER_TEMP/probe.py" <<'PY'
          import os, ssl, sys, urllib.error, urllib.request
          UA = {"User-Agent": "sibyl-memory-smoke/1"}
          def classify(e):
              # An HTTPError is a real HTTP status, so the handshake SUCCEEDED
              # (Cloudflare 403s our datacenter IP). Only a cert error is a TLS fail.
              if isinstance(e, urllib.error.HTTPError):
                  return "TLS_OK"
              if isinstance(e, urllib.error.URLError) and "CERTIFICATE_VERIFY_FAILED" in repr(e):
                  return "TLS_FAIL"
              return "OTHER"  # DNS, refused, timeout: never reached the TLS check
          def probe(ctx):
              req = urllib.request.Request(os.environ["PROBE_URL"], headers=UA)
              try:
                  with urllib.request.urlopen(req, context=ctx, timeout=15) as r:
                      return "TLS_OK", r.status, r.read(120)
              except urllib.error.HTTPError as e:
                  return "TLS_OK", e.code, e.read(120)
              except Exception as e:
                  return classify(e), None, repr(e)
          stock = ssl.create_default_context()
          if sys.argv[1] == "baseline":
              cls, status, body = probe(stock)
              print("BASELINE:", cls, "status:", status, body)
              if cls == "TLS_OK":
                  raise SystemExit("BASELINE: the stock context VERIFIED, so this runner still has a wired CA store and is NOT reproducing the report")
              raise SystemExit(0 if cls == "TLS_FAIL" else "BASELINE: WRONG failure: %s" % (body,))
          import certifi
          from sibyl_memory_client._trust import https_context
          ctx = https_context()
          print("certifi:", certifi.where(), "| fixed store:", ctx.cert_store_stats(), "| stock store:", stock.cert_store_stats())
          cls, status, body = probe(ctx)
          print("FIX:", cls, "status:", status, body)
          if cls != "TLS_OK":
              raise SystemExit("FIX: %s: %s" % (cls, body))
          PY
      - name: baseline, expected to FAIL with CERTIFICATE_VERIFY_FAILED
        continue-on-error: true
        run: '"$RUNNER_TEMP/smoke/bin/python" "$RUNNER_TEMP/probe.py" baseline'
      - name: the fix, must SUCCEED
        run: '"$RUNNER_TEMP/smoke/bin/python" "$RUNNER_TEMP/probe.py" fix'

      - name: "the CLI must not report a server error 0"
        run: |
          set -eu
          export PATH="$RUNNER_TEMP/smoke/bin:$PATH"
          # `sibyl update` reads PyPI over HTTPS through the same trust context,
          # so it is the command that actually exercises the fixed path.
          sibyl update 2>&1 | tee cli.txt
          sibyl status 2>&1 | tee -a cli.txt
          if grep -q "server error: 0" cli.txt; then
            echo "FAIL: the CLI still reports 'server error: 0'"
            exit 1
          fi
          if grep -qi "CERTIFICATE_VERIFY_FAILED" cli.txt; then
            echo "FAIL: the CLI still hits a certificate verification failure"
            exit 1
          fi
